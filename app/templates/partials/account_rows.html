{% for account in accounts.items %}
  {% set error_key = account.error_message %}
  <tr data-account-id="{{ account.id }}" data-status="{{ account.status }}">
    <td data-field="email">
      <div class="credential-cell">
        <span data-value title="{{ account.email }}">{{ account.email }}</span>
        <button type="button" data-copy="email">{{ t("accounts.copy_email") }}</button>
      </div>
    </td>
    <td data-field="password">
      <div class="credential-cell">
        <span data-value title="{{ account.password }}">{{ account.password }}</span>
        <button type="button" data-copy="password">{{ t("accounts.copy_password") }}</button>
      </div>
    </td>
    <td data-field="copy_count" data-label="{{ t('accounts.copy_count') }}">{{ account.copy_count }}</td>
    <td data-field="status" data-label="{{ t('accounts.status') }}">{{ t("status." ~ account.status) }}</td>
    <td class="actions" data-label="{{ t('accounts.details') }}">
      <button type="button" data-details>{{ t("accounts.details") }}</button>
    </td>
  </tr>
{% endfor %}
