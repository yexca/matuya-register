<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b5b">
    <title>{{ t("app.title") }}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="app-header">
      <h1>{{ t("app.title") }}</h1>
      {% if session.get("username") %}
        <nav class="header-actions" aria-label="Account">
          <span class="header-user">{{ session.get("username") }}</span>
          <form action="{{ url_for('i18n.set_locale') }}" method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label class="visually-hidden" for="locale">{{ t("nav.language") }}</label>
            <select id="locale" name="locale" onchange="this.form.submit()" aria-label="{{ t('nav.language') }}">
              {% for item in supported_locales %}
                <option value="{{ item }}" {% if item == locale %}selected{% endif %}>{{ item }}</option>
              {% endfor %}
            </select>
          </form>
          <form action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="ghost-button">{{ t("auth.logout") }}</button>
          </form>
        </nav>
      {% endif %}
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script>
      window.APP_CONFIG = Object.assign(window.APP_CONFIG || {}, {
        csrfToken: "{{ csrf_token() }}",
        locale: "{{ locale }}",
        messages: {{ i18n_catalog | tojson }}
      });
    </script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
